[project]
name = "autochess-tools"
version = "0.1.0"
description = "牛马自走棋的分析和平衡实验工具：通过 Rust 版结算（engine/）批量模拟，自己不实现战斗规则"
requires-python = ">=3.12"
dependencies = ["autochess-engine", "numpy>=2"]

[tool.uv.sources]
# Rust 版结算的 Python 绑定：本地路径，uv sync 时用 maturin 编译（需要 Rust，见 engine/README.md）
autochess-engine = { path = "../engine/py" }

[dependency-groups]
art = [
    "fonttools>=4.68.0",
    "resvg-py>=0.5.0",
]
# 读写 Excel：数值试验表（autochess_tools/balance/sheet.py）、经济表（autochess_tools/economy/model.py）
balance = ["openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1a1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SVG 路径数据是长字符串
"autochess_tools/art/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
