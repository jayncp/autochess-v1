<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>各阶段出场率和带卡得分</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --hover: #f0efec;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --hover: #2c2c2a;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 16px 24px 4px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { color: var(--ink2); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 10px 24px; position: sticky; top: 0; background: var(--page); z-index: 5; border-bottom: 1px solid var(--grid); }
  .group { display: flex; gap: 6px; align-items: center; }
  .group > span { color: var(--ink2); font-size: 13px; }
  button.chip { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.chip[aria-pressed="false"] { color: var(--muted); background: transparent; }
  button.chip[aria-pressed="false"] i { opacity: .25; }
  button.chip i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  input[type=search] { font: inherit; padding: 4px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); width: 150px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 16px; padding: 16px 24px 32px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 12px 14px; }
  .panel h2 { font-size: 15px; margin: 0; }
  .panel p { margin: 2px 0 6px; color: var(--ink2); font-size: 12.5px; }
  .charts { display: grid; gap: 16px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--muted); font-size: 12px; }
  svg .stage { fill: var(--ink2); font-size: 13px; }
  .line { fill: none; stroke-width: 1.5; opacity: .38; stroke-linejoin: round; stroke-linecap: round; }
  .dim .line { opacity: .1; }
  .dim .line.on, .line.on { opacity: 1; stroke-width: 3; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .label { fill: var(--ink); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
  .side { position: sticky; top: 58px; max-height: calc(100vh - 74px); display: flex; flex-direction: column; }
  .tablewrap { overflow: auto; margin-top: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--surface); text-align: right; font-weight: 500; color: var(--ink2); padding: 4px 6px; border-bottom: 1px solid var(--axis); cursor: pointer; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  tr.row { cursor: pointer; }
  tr.row:hover, tr.row.hot { background: var(--hover); }
  tr.row.pin td:first-child { font-weight: 700; }
  tr.row.pin td:first-child::after { content: " ●"; color: var(--ink2); font-size: 10px; }
  #tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 6px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 440px; display: none; z-index: 10; }
  #tip b { font-size: 14px; }
  #tip .sub { color: var(--ink2); font-size: 12.5px; }
  #tip .more { color: var(--ink2); margin-top: 4px; border-top: 1px solid var(--grid); padding-top: 4px; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>各阶段出场率和带卡得分</h1>
  <div class="note" id="note"></div>
</header>
<div class="controls">
  <div class="group" id="kinds"><span>类型</span></div>
  <div class="group" id="stars"><span>星级</span></div>
  <div class="group" id="quick"><span>筛选</span></div>
  <div class="group"><input type="search" id="search" placeholder="搜卡名"></div>
  <div class="group"><button class="chip" id="clear">取消固定</button></div>
</div>
<main>
  <div class="charts">
    <div class="panel">
      <h2>出场率</h2>
      <p>均衡分布里带这张卡的阵容占比。一条线是一张卡，颜色是星级；鼠标移到线上看卡名，点击固定。</p>
      <svg id="usage"></svg>
    </div>
    <div class="panel">
      <h2>带卡得分</h2>
      <p>必须带这张卡时，最强阵容对均衡分布的得分。0.50 是持平，明显低于 0.50 是带上就吃亏。</p>
      <svg id="score"></svg>
    </div>
  </div>
  <div class="panel side">
    <h2 id="count"></h2>
    <p>点表头排序；鼠标移到某行会在图上高亮，点击固定。</p>
    <div class="tablewrap"><table id="table"></table></div>
  </div>
</main>

  const head = node("tr", {}, ...COLUMNS.map(([k, label]) => node("th", {
    onclick: () => { state.desc = state.sort === k ? !state.desc : k !== "name"; state.sort = k; render(); },
  }, label + (state.sort === k ? (state.desc ? " ↓" : " ↑") : ""))));
  rows = new Map(sorted.map(c => [c.id, node("tr", {
    className: "row", onmouseenter: () => setHot(c.id), onmouseleave: () => setHot(null), onclick: () => togglePin(c.id),
  },
    node("td", {}, node("i", { style: `background:${color(c.star)}` }), c.name), node("td", {}, `${c.star}★`),
    node("td", {}, `${c.peak.toFixed(0)}%`), node("td", {}, `${c.low.toFixed(0)}%`),
    node("td", {}, c.best.toFixed(2)), node("td", {}, c.worst.toFixed(2)))]));
  $("table").replaceChildren(node("thead", {}, head), node("tbody", {}, ...rows.values()));
  $("count").textContent = `${state.kind} ${cards.length} 张`;
}

let current = [];
function render() {
  [kinds, stars, quick].forEach(h => h.sync());
  current = visible();
  CHARTS.forEach(chart => draw(chart, current));
  table(current);
  highlight();
}
render();
</script>
</body>
</html>
